<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Empires – Census & City Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f5f0e8;
    --surface:   #fdfaf4;
    --border:    #d4c49a;
    --gold:      #8a6a20;
    --gold-dim:  #b08a40;
    --amber:     #6a4e10;
    --text:      #2a2010;
    --muted:     #8a7a5a;
    --red:       #c0402a;
    --green:     #3a6a30;
    --blue:      #2a5070;
    --census-line: #2a5070;
    --cities-line: #c0602a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  header { text-align: center; margin-bottom: 52px; }
  header .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(26px, 5vw, 46px);
    font-weight: 700;
    color: var(--amber);
    letter-spacing: .06em;
    line-height: 1.1;
  }
  header .rule {
    width: 160px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 18px auto 0;
  }

  .table-wrap { max-width: 820px; margin: 0 auto; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  thead tr {
    background: #ede8da;
    border-bottom: 1px solid var(--gold-dim);
  }

  th {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--gold-dim);
    padding: 12px 10px;
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
  }
  th:nth-child(2), th:nth-child(3), th:nth-child(4), th:nth-child(5) { text-align: center; }
  th:nth-child(6) { text-align: right; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(180,150,80,.08); }
  tbody tr.updated { background: rgba(58,106,48,.12); }

  td { padding: 10px; font-weight: 300; color: var(--text); }

  td.civ-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: .03em;
  }

  /* City table block column */
  #cities-table .block-cell {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #cities-table .block-cell.west { color: var(--green); }
  #cities-table .block-cell.east { color: #6b3fb8; }
  #cities-table .block-cell.hidden,
  #cities-table .block-header.hidden { display: none; }

  td.ast-rank {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-dim);
  }
  td.census { text-align: center; }
  td.action  { text-align: right; }

  .census-input {
    width: 64px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    padding: 6px;
    outline: none;
    transition: border-color .15s;
  }
  .census-input:focus { border-color: var(--gold-dim); }
  .census-input::-webkit-outer-spin-button,
  .census-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .census-input[type=number] { -moz-appearance: textfield; }

  .remove-btn, .add-btn {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .remove-btn { background: #c04030; border: 1px solid #a03020; color: #fff; }
  .remove-btn:hover { background: #a03020; border-color: #802010; color: #fff; }

  .add-btn { background: #3a6a30; border: 1px solid #2a5020; color: #fff; }
  .add-btn:hover { background: #2a5020; border-color: #1a4010; color: #fff; }

  .reset-wrap { text-align: right; margin-top: 18px; }
  .reset-btn {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: var(--gold-dim);
    border: 1px solid var(--gold);
    color: #fff;
    padding: 8px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .reset-btn:hover { background: var(--gold); border-color: var(--amber); }
  .reset-btn:disabled { background: #c8bfa0; border-color: #b0a880; color: #fff; cursor: not-allowed; opacity: .6; }

  .removed-section { margin-top: 36px; display: none; }
  .removed-section.visible { display: block; }
  .section-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .back-wrap { margin-bottom: 32px; }
  .back-link {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color .15s;
  }
  .back-link:hover { color: var(--amber); }

  /* Military toggle */
  td.military { text-align: center; }
  .mil-toggle {
    width: 44px;
    height: 26px;
    border-radius: 13px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background .2s;
    background: #ccc;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
  }
  .mil-toggle::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    left: 3px;
    transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .mil-toggle.on { background: #c04030; }
  .mil-toggle.on::after { transform: translateX(18px); }

  /* Timer */
  td.timer-cell { white-space: nowrap; }
  .timer-wrap { display: flex; align-items: center; gap: 5px; }
  .timer-input {
    width: 58px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    text-align: center;
    padding: 5px 4px;
    outline: none;
    transition: border-color .15s;
  }
  .timer-input:focus { border-color: var(--gold-dim); }
  .timer-display {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--amber);
    min-width: 44px;
    text-align: center;
  }
  .timer-display.urgent { color: var(--red); }
  .timer-start-btn, .timer-stop-btn {
    background: var(--gold-dim);
    border: none;
    border-radius: 3px;
    color: #fff;
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .timer-start-btn:hover { background: var(--gold); }
  .timer-stop-btn { background: #9b2a1a; }
  .timer-stop-btn:hover { background: var(--red); }
  @keyframes flash-alert {
    0%, 100% { background: transparent; }
    50%       { background: rgba(192,64,42,.25); }
  }
  tbody tr.timer-done { animation: flash-alert .5s ease-in-out infinite; }

  /* Toast notification */
  #toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #9b2a1a;
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .05em;
    padding: 12px 18px;
    border-radius: 4px;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    animation: toast-in .3s ease;
    pointer-events: all;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Hamburger nav */
  .hamburger {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 200;
    background: none;
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: border-color .2s;
  }
  .hamburger:hover { border-color: var(--gold); }
  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--gold-dim);
    border-radius: 2px;
    transition: background .2s;
  }
  .hamburger:hover span { background: var(--gold); }
  .nav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 300;
  }
  .nav-overlay.open { display: block; }
  .nav-drawer {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100%;
    z-index: 400;
    background: var(--surface); box-shadow: 2px 0 12px rgba(0,0,0,.15);
    border-right: 1px solid var(--border);
    padding: 48px 24px;
    transition: left .25s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-drawer.open { left: 0; }
  .nav-drawer-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 16px;
  }
  .nav-link {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--text);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 3px;
    border: 1px solid transparent;
    transition: border-color .15s, color .15s;
    display: block;
  }
  .nav-link:hover { border-color: var(--gold-dim); color: var(--amber); }
  .nav-link.active { color: var(--amber); border-color: var(--gold-dim); background: rgba(201,168,76,.06); }
  .nav-link.disabled {
    color: var(--muted);
    border-color: transparent;
    opacity: .5;
    cursor: not-allowed;
    pointer-events: none;
  }
  .nav-link.disabled .soon-tag {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .8;
    margin-left: 6px;
  }
  /* Game report */
  .report-section { margin-top: 48px; }
  .report-status { font-size: 15px; color: var(--muted); margin-bottom: 12px; }
  .report-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .report-actions .reset-btn.secondary { background: transparent; color: var(--gold); }
  .report-actions .reset-btn.secondary:hover { background: rgba(176,138,64,.12); }
  #report { display: none; margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  #report.visible { display: block; }
  .report-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .report-controls label { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  #report-civ { font-family: 'Cinzel', serif; font-size: 14px; color: var(--amber); background: #fff; border: 1px solid var(--border); border-radius: 3px; padding: 6px 8px; }
  .report-legend { display: flex; gap: 18px; margin-left: auto; font-size: 14px; color: var(--text); }
  .report-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .report-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; }
  .report-legend i.dashed { border-top-style: dashed; }
  .chart-wrap { position: relative; }
  #report-chart { width: 100%; height: auto; display: block; }
  #report-chart text { font-family: 'Crimson Pro', Georgia, serif; font-size: 13px; fill: var(--muted); }
  #report-chart text.axis-title { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .12em; }
  #report-chart .grid { stroke: var(--border); stroke-width: 1; }
  #report-chart .axis { stroke: var(--gold-dim); stroke-width: 1; }
  #report-chart .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart-tooltip { position: absolute; pointer-events: none; display: none; background: var(--text); color: #fff; font-size: 14px; line-height: 1.35; padding: 6px 10px; border-radius: 3px; white-space: nowrap; transform: translate(-50%, -100%); }
  .chart-tooltip b { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .06em; }
  .report-empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<button class="hamburger" onclick="openNav()" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div class="nav-overlay" id="nav-overlay" onclick="closeNav()"></div>
<div class="nav-drawer" id="nav-drawer">
  <p class="nav-drawer-title">Navigation</p>
  <a class="nav-link " href="index.html">Phase Order</a>
  <a class="nav-link active" href="censusandcityhelper.html">Census &amp; City Helper</a>
  <span class="nav-link disabled" aria-disabled="true">Calamity Resolution<span class="soon-tag">Soon</span></span>
  <a class="nav-link" href="conflict.html">Conflict Resolution</a>
  <a class="nav-link" href="strategy.html">Strategy &amp; Tips</a>
</div>
<div id="toast-container"></div>

<header>
  <p class="eyebrow">Quick Reference</p>
  <h1>Census & City Helper</h1>
  <div class="rule"></div>
</header>

<div class="table-wrap">

  <div class="back-wrap">
    <a href="index.html" class="back-link">← Phase Order</a>
  </div>

  <!-- Shared timer input -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <span style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);">Timer</span>
    <input id="shared-timer-input" class="timer-input" type="text" placeholder="MM:SS" maxlength="5" style="width:70px;">
  </div>

  <div class="table-scroll"><table id="active-table">
    <thead>
      <tr>
        <th>Civ</th>
        <th>AST Rank</th>
        <th>Census</th>
        <th>Timer</th>
        <th>Military</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="active-tbody"><!-- rows built from civs.js on load --></tbody>
  </table>
</div><!-- /.table-scroll -->

  <div class="reset-wrap">
    <button class="reset-btn" id="sort-census-btn" onclick="sortTable()">Sort by Census ↓</button>
  </div>

  <!-- Cities table -->
  <div style="margin-top:36px;">
    <div class="table-scroll">
    <table id="cities-table">
      <thead>
        <tr>
          <th class="block-header" id="cities-block-header">Block</th>
          <th>Civ</th>
          <th>AST Rank</th>
          <th>Cities</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cities-tbody"><!-- rows built from civs.js on load --></tbody>
    </table>
    </div><!-- /.table-scroll -->
    <div class="reset-wrap">
      <button class="reset-btn" id="sort-cities-btn" onclick="sortCityTable()">Sort by Cities ↑</button>
    </div>
  </div>

  <!-- Single shared not-in-game table -->
  <div class="removed-section" id="removed-section">
    <p class="section-label">Not in game</p>
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Civ</th>
          <th>AST Rank</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="removed-tbody"></tbody>
    </table>
    </div><!-- /.table-scroll -->
  </div>

  <!-- Game report: census/city counts recorded each turn -->
  <div class="report-section" id="report-section">
    <p class="section-label">Game Report</p>
    <p class="report-status" id="report-status"></p>
    <div class="report-actions">
      <button class="reset-btn" id="report-btn" onclick="showReport()">Generate Report</button>
      <button class="reset-btn secondary" id="clear-stats-btn" onclick="clearStats()">Clear Stats</button>
    </div>
    <div id="report">
      <div class="report-controls">
        <label for="report-civ">Civ</label>
        <select id="report-civ" onchange="renderChart()"></select>
        <div class="report-legend">
          <span><i style="border-color:var(--census-line)"></i>Census</span>
          <span><i class="dashed" style="border-color:var(--cities-line)"></i>Cities</span>
        </div>
      </div>
      <div class="chart-wrap">
        <svg id="report-chart" role="img"></svg>
        <div class="chart-tooltip" id="chart-tooltip"></div>
      </div>
    </div>
  </div>

</div>

<script src="civs.js"></script>
<script>
  function insertByAst(tbody, row) {
    var ast = parseInt(row.dataset.ast);
    var rows = Array.from(tbody.querySelectorAll('tr'));
    for (var i = 0; i < rows.length; i++) {
      if (parseInt(rows[i].dataset.ast) > ast) {
        tbody.insertBefore(row, rows[i]);
        return;
      }
    }
    tbody.appendChild(row);
  }

  // STORAGE_KEY is shared with the Calamity Resolution page via civs.js
  // (MEGA_EMPIRES_NOT_IN_GAME_KEY) so "not in game" status stays in sync.
  var STORAGE_KEY = MEGA_EMPIRES_NOT_IN_GAME_KEY;

  function saveRemovedCivs() {
    var removed = Array.from(document.querySelectorAll('#removed-tbody tr')).map(function(r) {
      return { ast: r.dataset.ast, name: r.querySelector('.civ-name').textContent };
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(removed));
  }

  function buildActiveRow(ast, name) {
    var tr = document.createElement('tr');
    tr.dataset.ast = ast;
    tr.innerHTML =
      '<td class="civ-name">' + name + '</td>' +
      '<td class="ast-rank">' + ast + '</td>' +
      '<td class="census"><input class="census-input" type="number" value="0" min="0"></td>' +
      '<td class="timer-cell">' + timerHtml() + '</td>' +
      '<td class="military"><button class="mil-toggle" onclick="this.classList.toggle(\'on\')"></button></td>' +
      '<td class="action"><button class="remove-btn" onclick="removeRow(this)">Remove</button></td>';
    return tr;
  }

  function getCityBlock(ast, activeCount) {
    var civ = megaEmpiresGetCivByAst(ast);
    if (!civ) return '';

    // Default blocks come from civs.js. In 12-16 player games,
    // Assyria (AST 3) moves to the East block.
    if (activeCount >= 12 && activeCount <= 16 && ast === 3) return 'East';

    // In 13-14 player games, Egypt (AST 17) moves to the East block.
    if (activeCount >= 13 && activeCount <= 14 && ast === 17) return 'East';

    return civ.block;
  }

  function updateCityBlocks() {
    var citiesTable = document.getElementById('cities-table');
    // Count the rows in the table rather than the saved "not in game" list:
    // removeRow/addRow update the tables before they write to localStorage,
    // so the saved list is one change out of date at this point.
    var activeCount = citiesTable.querySelectorAll('tbody tr').length;
    var showBlocks = activeCount > 11;
    var blockHeader = document.getElementById('cities-block-header');

    blockHeader.classList.toggle('hidden', !showBlocks);

    Array.from(citiesTable.querySelectorAll('tbody tr')).forEach(function(row) {
      var blockCell = row.querySelector('.block-cell');
      if (!blockCell) return;

      var block = getCityBlock(parseInt(row.dataset.ast), activeCount);
      blockCell.textContent = showBlocks ? block : '';
      blockCell.classList.toggle('hidden', !showBlocks);
      blockCell.classList.toggle('west', block === 'West');
      blockCell.classList.toggle('east', block === 'East');
    });
  }

  function buildCityRow(ast, name) {
    var tr = document.createElement('tr');
    tr.dataset.ast = ast;
    tr.innerHTML =
      '<td class="block-cell"></td>' +
      '<td class="civ-name">' + name + '</td>' +
      '<td class="ast-rank">' + ast + '</td>' +
      '<td class="census"><input class="census-input" type="number" value="0" min="0"></td>' +
      '<td class="action"><button class="remove-btn" onclick="removeRow(this)">Remove</button></td>';
    return tr;
  }

  // Builds the census/city/not-in-game tables from the shared civs.js
  // roster (all 18 civilizations), respecting anything already marked
  // "not in game" in localStorage.
  function initRoster() {
    var notInAsts = megaEmpiresGetNotInGame().map(function(c) { return parseInt(c.ast); });
    var activeTbody = document.getElementById('active-tbody');
    var citiesTbody = document.getElementById('cities-tbody');
    var removedTbody = document.getElementById('removed-tbody');

    MEGA_EMPIRES_CIVS.forEach(function(civ) {
      if (notInAsts.indexOf(civ.ast) === -1) {
        activeTbody.appendChild(buildActiveRow(civ.ast, civ.name));
        citiesTbody.appendChild(buildCityRow(civ.ast, civ.name));
      } else {
        var tr = document.createElement('tr');
        tr.dataset.ast = civ.ast;
        tr.innerHTML =
          '<td class="civ-name">' + civ.name + '</td>' +
          '<td class="ast-rank">' + civ.ast + '</td>' +
          '<td class="action"><button class="add-btn" onclick="addRow(this)">Add to Game</button></td>';
        removedTbody.appendChild(tr);
      }
    });

    if (removedTbody.querySelectorAll('tr').length > 0) {
      document.getElementById('removed-section').classList.add('visible');
    }

    updateCityBlocks();
  }

  function removeRow(btn) {
    var ast = parseInt(btn.closest('tr').dataset.ast);
    var civName = btn.closest('tr').querySelector('.civ-name').textContent;

    // Remove from both tables
    var censusRow = document.querySelector('#active-tbody tr[data-ast="' + ast + '"]');
    var cityRow   = document.querySelector('#cities-tbody tr[data-ast="' + ast + '"]');
    if (censusRow) censusRow.remove();
    if (cityRow)   cityRow.remove();
    checkAllUpdated();
    checkAllCityUpdated();

    // Add to shared removed table
    var newRow = document.createElement('tr');
    newRow.dataset.ast = ast;
    newRow.innerHTML =
      '<td class="civ-name">' + civName + '</td>' +
      '<td class="ast-rank">' + ast + '</td>' +
      '<td class="action"><button class="add-btn" onclick="addRow(this)">Add to Game</button></td>';
    document.getElementById('removed-tbody').appendChild(newRow);
    document.getElementById('removed-section').classList.add('visible');
    updateCityBlocks();
    saveRemovedCivs();
  }

  function addRow(btn) {
    var row = btn.closest('tr');
    var ast = parseInt(row.dataset.ast);
    var civName = row.querySelector('.civ-name').textContent;

    // Add back to census table
    var censusRow = buildActiveRow(ast, civName);
    insertByAst(document.getElementById('active-tbody'), censusRow);
    censusRow.querySelector('.census-input').addEventListener('input', onCensusInput);
    checkAllUpdated();

    // Add back to cities table
    var cityRow = buildCityRow(ast, civName);
    insertByAst(document.getElementById('cities-tbody'), cityRow);
    cityRow.querySelector('.census-input').addEventListener('input', onCityInput);
    checkAllCityUpdated();

    row.remove();
    if (document.getElementById('removed-tbody').querySelectorAll('tr').length === 0) {
      document.getElementById('removed-section').classList.remove('visible');
    }
    updateCityBlocks();
    saveRemovedCivs();
  }

  function checkAllUpdated() {
    var rows = Array.from(document.querySelectorAll('#active-tbody tr'));
    var allUpdated = rows.length > 0 && rows.every(function(r) { return r.classList.contains('updated'); });
    if (allUpdated) {
      setTimeout(function() {
        rows.forEach(function(r) { r.classList.remove('updated'); });
      }, 800);
    }
  }

  function checkAllCityUpdated() {
    var rows = Array.from(document.querySelectorAll('#cities-tbody tr'));
    var allUpdated = rows.length > 0 && rows.every(function(r) { return r.classList.contains('updated'); });
    if (allUpdated) {
      setTimeout(function() {
        rows.forEach(function(r) { r.classList.remove('updated'); });
      }, 800);
    }
  }

  function onCensusInput(e) {
    var row = e.target.closest('tr');
    if (row) { row.dataset.entered = '1'; row.classList.add('updated'); checkAllUpdated(); }
  }

  function onCityInput(e) {
    var row = e.target.closest('tr');
    if (row) { row.dataset.entered = '1'; row.classList.add('updated'); checkAllCityUpdated(); }
  }

  function bindCensusInputs() {
    document.querySelectorAll('#active-tbody .census-input').forEach(function(input) {
      input.removeEventListener('input', onCensusInput);
      input.addEventListener('input', onCensusInput);
    });
  }

  function bindCityInputs() {
    document.querySelectorAll('#cities-tbody .census-input').forEach(function(input) {
      input.removeEventListener('input', onCityInput);
      input.addEventListener('input', onCityInput);
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    initRoster();
    bindCensusInputs();
    bindCityInputs();
    checkAllUpdated();
    checkAllCityUpdated();
    updateReportStatus();

    // Restore saved timer value
    var savedTimer = localStorage.getItem('mega-empires-timer');
    if (savedTimer) document.getElementById('shared-timer-input').value = savedTimer;

    // Save timer value on change
    document.getElementById('shared-timer-input').addEventListener('input', function() {
      localStorage.setItem('mega-empires-timer', this.value);
    });
  });

  function sortTable() {
    recordTurn('census', '#active-tbody tr');
    var tbody = document.getElementById('active-tbody');
    var rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort(function(a, b) {
      var aMil = a.querySelector('.mil-toggle').classList.contains('on') ? 1 : 0;
      var bMil = b.querySelector('.mil-toggle').classList.contains('on') ? 1 : 0;
      if (aMil !== bMil) return aMil - bMil;
      var aVal = parseInt(a.querySelector('.census-input').value) || 0;
      var bVal = parseInt(b.querySelector('.census-input').value) || 0;
      if (aVal !== bVal) return bVal - aVal;
      return parseInt(a.dataset.ast) - parseInt(b.dataset.ast);
    });
    rows.forEach(function(r) {
      r.classList.remove('updated');
      tbody.appendChild(r);
    });
  }

  function sortCityTable() {
    recordTurn('cities', '#cities-tbody tr');
    var tbody = document.getElementById('cities-tbody');
    var rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort(function(a, b) {
      var aVal = parseInt(a.querySelector('.census-input').value) || 0;
      var bVal = parseInt(b.querySelector('.census-input').value) || 0;
      if (aVal !== bVal) return aVal - bVal;
      return parseInt(a.dataset.ast) - parseInt(b.dataset.ast);
    });
    rows.forEach(function(r) {
      r.classList.remove('updated');
      tbody.appendChild(r);
    });
  }

  /* --- Stat tracking ------------------------------------------------------
   * Each time every row of a table has been filled in and the table is
   * sorted, its values are saved as the next turn for that table:
   *   { census: [{ turn: 1, values: { "<ast>": { name, value } } }, ...],
   *     cities: [ ...same shape... ] }
   * Census and cities count their turns separately, both starting at 1.
   */
  var STATS_KEY = 'mega-empires-stats';
  var CENSUS_MAX = 55;
  var CITIES_MAX = 9;

  function loadStats() {
    try {
      var stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
      return { census: stats.census || [], cities: stats.cities || [] };
    } catch (e) {
      return { census: [], cities: [] };
    }
  }

  function saveStats(stats) {
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  }

  function recordTurn(kind, rowSelector) {
    var rows = Array.from(document.querySelectorAll(rowSelector));
    var allEntered = rows.length > 0 && rows.every(function(r) { return r.dataset.entered === '1'; });
    if (!allEntered) return;

    var stats = loadStats();
    var values = {};
    rows.forEach(function(r) {
      values[r.dataset.ast] = {
        name: r.querySelector('.civ-name').textContent,
        value: parseInt(r.querySelector('.census-input').value) || 0
      };
      delete r.dataset.entered;
    });
    stats[kind].push({ turn: stats[kind].length + 1, values: values });
    saveStats(stats);
    updateReportStatus();
    if (document.getElementById('report').classList.contains('visible')) showReport();
  }

  function updateReportStatus() {
    var stats = loadStats();
    var plural = function(n) { return n + (n === 1 ? ' turn' : ' turns'); };
    document.getElementById('report-status').textContent =
      'Recorded: census ' + plural(stats.census.length) + ', cities ' + plural(stats.cities.length) +
      '. A turn is saved when every civ’s number has been entered and the table is sorted.';
  }

  function clearStats() {
    if (!confirm('Clear all recorded census and city stats for this game?')) return;
    localStorage.removeItem(STATS_KEY);
    document.querySelectorAll('#active-tbody tr, #cities-tbody tr').forEach(function(r) {
      delete r.dataset.entered;
    });
    updateReportStatus();
    document.getElementById('report').classList.remove('visible');
  }

  function showReport() {
    var stats = loadStats();
    var select = document.getElementById('report-civ');
    var previous = select.value;

    // Every civ that appears in any recorded turn, in AST order.
    var civs = {};
    stats.census.concat(stats.cities).forEach(function(t) {
      Object.keys(t.values).forEach(function(ast) { civs[ast] = t.values[ast].name; });
    });
    var asts = Object.keys(civs).sort(function(a, b) { return a - b; });

    select.innerHTML = asts.map(function(ast) {
      return '<option value="' + ast + '">' + civs[ast] + '</option>';
    }).join('');
    if (asts.indexOf(previous) !== -1) select.value = previous;

    document.getElementById('report').classList.add('visible');
    renderChart();
  }

  function svgEl(tag, attrs, text) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function renderChart() {
    var svg = document.getElementById('report-chart');
    var tooltip = document.getElementById('chart-tooltip');
    var stats = loadStats();
    var ast = document.getElementById('report-civ').value;
    svg.innerHTML = '';
    tooltip.style.display = 'none';

    // Size the drawing to the container so text stays readable on phones.
    var W = Math.max(300, svg.parentNode.clientWidth || 760);
    var H = W < 500 ? 280 : 340, L = 48, R = 44, T = 20, B = 48;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var plotW = W - L - R, plotH = H - T - B;
    var turns = Math.max(stats.census.length, stats.cities.length);

    if (!ast || turns === 0) {
      svg.appendChild(svgEl('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', 'class': 'report-empty' },
        'No turns recorded yet'));
      return;
    }

    var civName = document.getElementById('report-civ').selectedOptions[0].textContent;
    svg.setAttribute('aria-label', civName + ' census and city count by turn');

    var x = function(turn) { return turns === 1 ? L + plotW / 2 : L + (turn - 1) / (turns - 1) * plotW; };
    var yCensus = function(v) { return T + plotH - Math.min(v, CENSUS_MAX) / CENSUS_MAX * plotH; };
    var yCities = function(v) { return T + plotH - Math.min(v, CITIES_MAX) / CITIES_MAX * plotH; };

    // Left axis: census, with the gridlines.
    for (var c = 0; c <= CENSUS_MAX; c += 11) {
      svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: yCensus(c), y2: yCensus(c), 'class': 'grid' }));
      svg.appendChild(svgEl('text', { x: L - 8, y: yCensus(c) + 4, 'text-anchor': 'end' }, c));
    }
    // Right axis: cities.
    for (var n = 0; n <= CITIES_MAX; n++) {
      svg.appendChild(svgEl('text', { x: W - R + 8, y: yCities(n) + 4, 'text-anchor': 'start' }, n));
    }
    svg.appendChild(svgEl('line', { x1: L, x2: L, y1: T, y2: T + plotH, 'class': 'axis' }));
    svg.appendChild(svgEl('line', { x1: W - R, x2: W - R, y1: T, y2: T + plotH, 'class': 'axis' }));
    svg.appendChild(svgEl('text', { 'class': 'axis-title', 'text-anchor': 'middle',
      transform: 'translate(14,' + (T + plotH / 2) + ') rotate(-90)', fill: 'var(--census-line)' }, 'CENSUS'));
    svg.appendChild(svgEl('text', { 'class': 'axis-title', 'text-anchor': 'middle',
      transform: 'translate(' + (W - 12) + ',' + (T + plotH / 2) + ') rotate(90)', fill: 'var(--cities-line)' }, 'CITIES'));

    // Bottom axis: turn number. Thin the labels out on long games.
    var step = Math.ceil(turns / Math.max(4, Math.floor(plotW / 40)));
    for (var t = 1; t <= turns; t++) {
      // Always label the last turn, dropping any label that would crowd it.
      if (t !== turns && ((t - 1) % step !== 0 || turns - t < step)) continue;
      svg.appendChild(svgEl('text', { x: x(t), y: T + plotH + 20, 'text-anchor': 'middle' }, t));
    }
    svg.appendChild(svgEl('text', { x: L + plotW / 2, y: H - 6, 'text-anchor': 'middle', 'class': 'axis-title' }, 'TURN'));

    // One line per measure. A turn the civ wasn't in the game breaks the line.
    function series(records, y, color, dashed, kind) {
      var points = records.map(function(rec) {
        var v = rec.values[ast];
        return v ? { turn: rec.turn, value: v.value, x: x(rec.turn), y: y(v.value) } : null;
      });
      var d = '', pen = false;
      points.forEach(function(p) {
        if (!p) { pen = false; return; }
        d += (pen ? 'L' : 'M') + p.x + ' ' + p.y;
        pen = true;
      });
      if (d) {
        var attrs = { d: d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
        if (dashed) attrs['stroke-dasharray'] = '6 4';
        svg.appendChild(svgEl('path', attrs));
      }
      points.forEach(function(p) {
        if (p) svg.appendChild(svgEl('circle', { cx: p.x, cy: p.y, r: 4, fill: color,
          stroke: 'var(--surface)', 'stroke-width': 2, 'class': 'point-' + kind }));
      });
      return points;
    }
    var censusPts = series(stats.census, yCensus, 'var(--census-line)', false, 'census');
    var citiesPts = series(stats.cities, yCities, 'var(--cities-line)', true, 'cities');

    // Hover / tap: a crosshair and the values for the nearest turn.
    var crosshair = svgEl('line', { y1: T, y2: T + plotH, 'class': 'crosshair', visibility: 'hidden' });
    svg.appendChild(crosshair);
    var hit = svgEl('rect', { x: L - 10, y: T, width: plotW + 20, height: plotH, fill: 'transparent' });
    svg.appendChild(hit);

    function pointAt(evt) {
      var rect = svg.getBoundingClientRect();
      var px = (evt.clientX - rect.left) / rect.width * W;
      var turn = turns === 1 ? 1 : Math.round((px - L) / plotW * (turns - 1)) + 1;
      turn = Math.max(1, Math.min(turns, turn));
      var cen = censusPts[turn - 1], cit = citiesPts[turn - 1];
      crosshair.setAttribute('x1', x(turn));
      crosshair.setAttribute('x2', x(turn));
      crosshair.setAttribute('visibility', 'visible');
      tooltip.innerHTML = '<b>' + civName + ' · Turn ' + turn + '</b><br>' +
        'Census: ' + (cen ? cen.value : '–') + '<br>Cities: ' + (cit ? cit.value : '–');
      tooltip.style.left = (x(turn) / W * rect.width) + 'px';
      tooltip.style.top = (T / H * rect.height) + 'px';
      tooltip.style.display = 'block';
    }
    hit.addEventListener('pointermove', pointAt);
    hit.addEventListener('pointerdown', pointAt);
    hit.addEventListener('pointerleave', function() {
      crosshair.setAttribute('visibility', 'hidden');
      tooltip.style.display = 'none';
    });
  }

  window.addEventListener('resize', function() {
    if (document.getElementById('report').classList.contains('visible')) renderChart();
  });

  function timerHtml() {
    return '<div class="timer-wrap">' +
      '<button class="timer-start-btn" onclick="startTimer(this)">&#9654;</button>' +
      '<span class="timer-display" style="display:none"></span>' +
      '<button class="timer-stop-btn" style="display:none" onclick="stopTimer(this)">&#9632;</button>' +
      '</div>';
  }

  function parseTime(val) {
    val = val.trim();
    if (/^\d+$/.test(val)) return parseInt(val);
    var parts = val.split(':');
    if (parts.length === 2) {
      var m = parseInt(parts[0]) || 0;
      var s = parseInt(parts[1]) || 0;
      return m * 60 + s;
    }
    return 0;
  }

  function formatTime(secs) {
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  var audioCtx = null;
  var audioUnlocked = false;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    var ctx = getAudioCtx();
    // Play a silent buffer — required on iOS to fully unlock audio
    var buf = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    src.onended = function() { audioUnlocked = true; };
  }

  function beep() {
    try {
      var ctx = getAudioCtx();
      [0, 0.3, 0.6].forEach(function(t) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.4, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.25);
      });
    } catch(e) {}
  }

  function showToast(message, row) {
    var container = document.getElementById('toast-container');
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = message + '<br><span style="font-size:10px;opacity:.7;letter-spacing:.1em">TAP TO DISMISS</span>';
    toast.style.cursor = 'pointer';
    toast.addEventListener('click', function() {
      toast.remove();
      if (row) {
        row.classList.remove('timer-done');
        row.classList.add('updated');
        checkAllUpdated();
      }
    });
    container.appendChild(toast);
  }

  function startTimer(btn) {
    unlockAudio(); // play silent buffer to fully unlock iOS audio during user gesture
    var wrap = btn.closest('.timer-wrap');
    var display = wrap.querySelector('.timer-display');
    var stopBtn = wrap.querySelector('.timer-stop-btn');
    var secs = parseTime(document.getElementById('shared-timer-input').value);
    if (!secs || secs <= 0) { document.getElementById('shared-timer-input').focus(); return; }

    btn.style.display = 'none';
    display.style.display = 'inline';
    stopBtn.style.display = 'inline';
    display.textContent = formatTime(secs);
    display.classList.remove('urgent');

    var interval = setInterval(function() {
      secs--;
      display.textContent = formatTime(secs);
      if (secs <= 10) display.classList.add('urgent');
      if (secs <= 0) {
        clearInterval(interval);
        wrap.dataset.interval = '';
        var row = wrap.closest('tr');
        row.classList.add('timer-done');
        beep();
        showToast('\u23f0 Time is up for ' + row.querySelector('.civ-name').textContent + '!', row);
        stopTimer(stopBtn);
      }
    }, 1000);
    wrap.dataset.interval = interval;
  }

  function stopTimer(btn) {
    var wrap = btn.closest('.timer-wrap');
    clearInterval(parseInt(wrap.dataset.interval));
    var startBtn = wrap.querySelector('.timer-start-btn');
    var display = wrap.querySelector('.timer-display');
    startBtn.style.display = 'inline';
    display.style.display = 'none';
    btn.style.display = 'none';
    display.classList.remove('urgent');
  }

  function openNav() {
    document.getElementById('nav-drawer').classList.add('open');
    document.getElementById('nav-overlay').classList.add('open');
  }
  function closeNav() {
    document.getElementById('nav-drawer').classList.remove('open');
    document.getElementById('nav-overlay').classList.remove('open');
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNav();
  });
</script>

</body>
