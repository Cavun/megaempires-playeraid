<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Empires - Conflict Resolution Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #1a1610;
    --surface:   #231f18;
    --border:    #4a3f2a;
    --gold:      #c9a84c;
    --gold-dim:  #7a6130;
    --amber:     #e8c06a;
    --text:      #e8dfc8;
    --muted:     #a09070;
    --red:       #c0402a;
    --green:     #4a7c52;
    --blue:      #3a6080;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    line-height: 1.65;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  header { text-align: center; margin-bottom: 40px; }
  header .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(26px, 5vw, 46px);
    font-weight: 700;
    color: var(--amber);
    letter-spacing: .06em;
    line-height: 1.1;
  }
  header .rule {
    width: 160px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 18px auto 0;
  }

  .content { max-width: 560px; margin: 0 auto; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tool-btn {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .1em;
    padding: 10px 16px;
    border-radius: 3px;
    cursor: pointer;
    background: var(--surface);
    color: var(--amber);
    border: 1px solid var(--gold-dim);
    transition: border-color .15s, background .15s;
  }
  .tool-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }

  .counters { display: flex; flex-direction: column; gap: 14px; }

  .counter {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* The two tap halves fill the whole box; the label, count and remove
     button sit above them. Only the label and remove button take clicks. */
  .half {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--gold);
    font-size: 44px;
    font-weight: 300;
    line-height: 1;
    display: flex;
    align-items: center;
    transition: background .1s;
  }
  .half.dec { left: 0;  justify-content: flex-start; padding-left: 22px; }
  .half.inc { right: 0; justify-content: flex-end;   padding-right: 22px; }
  .half:active { background: rgba(201,168,76,.10); }

  .counter-body {
    position: relative;
    pointer-events: none;
    text-align: center;
    padding: 14px 80px 12px;
  }
  .label {
    pointer-events: auto;
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--amber);
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .05em;
    text-align: center;
    padding: 2px 0;
  }
  .label::placeholder { color: var(--gold-dim); font-weight: 400; }
  .label:focus { outline: none; border-bottom-color: var(--gold-dim); }
  .count {
    font-family: 'Cinzel', serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }

  .remove {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .remove:hover { color: var(--red); background: rgba(192,64,42,.12); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    padding: 24px 0;
  }

  /* Hamburger nav */
  .hamburger {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 200;
    background: none;
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: border-color .2s;
  }
  .hamburger:hover { border-color: var(--gold); }
  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--gold-dim);
    border-radius: 2px;
    transition: background .2s;
  }
  .hamburger:hover span { background: var(--gold); }
  .nav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 300;
  }
  .nav-overlay.open { display: block; }
  .nav-drawer {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100%;
    z-index: 400;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 48px 24px;
    transition: left .25s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-drawer.open { left: 0; }
  .nav-drawer-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 16px;
  }
  .nav-link {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--text);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 3px;
    border: 1px solid transparent;
    transition: border-color .15s, color .15s;
    display: block;
  }
  .nav-link:hover { border-color: var(--gold-dim); color: var(--amber); }
  .nav-link.active { color: var(--amber); border-color: var(--gold-dim); background: rgba(201,168,76,.06); }
  .nav-link.disabled {
    color: var(--muted);
    border-color: transparent;
    opacity: .5;
    cursor: not-allowed;
    pointer-events: none;
  }
  .nav-link.disabled .soon-tag {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .8;
    margin-left: 6px;
  }
</style>
</head>
<body>

<button class="hamburger" onclick="openNav()" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div class="nav-overlay" id="nav-overlay" onclick="closeNav()"></div>
<div class="nav-drawer" id="nav-drawer">
  <p class="nav-drawer-title">Navigation</p>
  <a class="nav-link" href="index.html">Phase Order</a>
  <a class="nav-link" href="censusandcityhelper.html">Census &amp; City Helper</a>
  <span class="nav-link disabled" aria-disabled="true">Calamity Resolution<span class="soon-tag">Soon</span></span>
  <a class="nav-link active" href="conflict.html">Conflict Resolution</a>
  <a class="nav-link" href="strategy.html">Strategy &amp; Tips</a>
</div>

<header>
  <p class="eyebrow">Mega Empires</p>
  <h1>Conflict Resolution</h1>
  <div class="rule"></div>
</header>

<div class="content">
  <div class="toolbar">
    <button class="tool-btn" id="add-btn" onclick="addCounter()">+ Add Counter</button>
    <button class="tool-btn" id="reset-btn" onclick="resetCounts()">Reset Counts</button>
  </div>
  <div class="counters" id="counters"></div>
</div>

<script>
  var STORAGE_KEY = 'mega-empires-conflict-counters';
  var counters = load();

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return [{ label: '', count: 0 }, { label: '', count: 0 }];
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(counters)); } catch (e) {}
  }

  function render() {
    var list = document.getElementById('counters');
    list.innerHTML = '';
    if (!counters.length) {
      list.innerHTML = '<p class="empty">No counters. Tap “+ Add Counter” to add one.</p>';
      return;
    }
    counters.forEach(function(c, i) {
      var box = document.createElement('div');
      box.className = 'counter';
      box.innerHTML =
        '<button class="half dec" aria-label="Decrease">−</button>' +
        '<button class="half inc" aria-label="Increase">+</button>' +
        '<div class="counter-body">' +
          '<input class="label" type="text" placeholder="Label" maxlength="30">' +
          '<div class="count"></div>' +
        '</div>' +
        '<button class="remove" aria-label="Remove counter">×</button>';

      var countEl = box.querySelector('.count');
      countEl.textContent = c.count;

      var label = box.querySelector('.label');
      label.value = c.label;
      label.addEventListener('input', function() { c.label = label.value; save(); });

      box.querySelector('.dec').addEventListener('click', function() {
        if (c.count > 0) c.count--;
        countEl.textContent = c.count;
        save();
      });
      box.querySelector('.inc').addEventListener('click', function() {
        c.count++;
        countEl.textContent = c.count;
        save();
      });
      box.querySelector('.remove').addEventListener('click', function() {
        counters.splice(i, 1);
        save();
        render();
      });

      list.appendChild(box);
    });
  }

  function addCounter() {
    counters.push({ label: '', count: 0 });
    save();
    render();
  }

  function resetCounts() {
    counters.forEach(function(c) { c.count = 0; });
    save();
    render();
  }

  render();

  function openNav() {
    document.getElementById('nav-drawer').classList.add('open');
    document.getElementById('nav-overlay').classList.add('open');
  }
  function closeNav() {
    document.getElementById('nav-drawer').classList.remove('open');
    document.getElementById('nav-overlay').classList.remove('open');
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNav();
  });
</script>

</body>
</html>
