<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Empires - Conflict Resolution Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #1a1610;
    --surface:   #231f18;
    --border:    #4a3f2a;
    --gold:      #c9a84c;
    --gold-dim:  #7a6130;
    --amber:     #e8c06a;
    --text:      #e8dfc8;
    --muted:     #a09070;
    --red:       #c0402a;
    --green:     #4a7c52;
    --blue:      #3a6080;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    line-height: 1.65;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  header { text-align: center; margin-bottom: 40px; }
  header .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(26px, 5vw, 46px);
    font-weight: 700;
    color: var(--amber);
    letter-spacing: .06em;
    line-height: 1.1;
  }
  header .rule {
    width: 160px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 18px auto 0;
  }

  .content { max-width: 560px; margin: 0 auto; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tool-btn {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .1em;
    padding: 10px 16px;
    border-radius: 3px;
    cursor: pointer;
    background: var(--surface);
    color: var(--amber);
    border: 1px solid var(--gold-dim);
    transition: border-color .15s, background .15s;
  }
  .tool-btn:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }

  .limit-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .limit-row label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }
  .limit-row input {
    width: 90px;
    background: var(--surface);
    border: 1px solid var(--gold-dim);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Cinzel', serif;
    font-size: 18px;
    text-align: center;
    padding: 6px 8px;
  }
  .limit-row input:focus { outline: none; border-color: var(--gold); }

  .resolve-btn { display: block; width: 100%; margin-top: 20px; padding: 14px 16px; font-size: 14px; }

  .counters { display: flex; flex-direction: column; gap: 14px; }

  .counter {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* The two tap halves fill the whole box; the label, count and remove
     button sit above them. Only the label and remove button take clicks. */
  .tap-area { position: relative; }

  .half {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--gold);
    font-size: 44px;
    font-weight: 300;
    line-height: 1;
    display: flex;
    align-items: center;
    transition: background .1s;
  }
  .half.dec { left: 0;  justify-content: flex-start; padding-left: 22px; }
  .half.inc { right: 0; justify-content: flex-end;   padding-right: 22px; }
  .half:active { background: rgba(201,168,76,.10); }

  .counter-body {
    position: relative;
    pointer-events: none;
    text-align: center;
    padding: 14px 80px 12px;
  }
  .label {
    pointer-events: auto;
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--amber);
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .05em;
    text-align: center;
    padding: 2px 0;
  }
  .label::placeholder { color: var(--gold-dim); font-weight: 400; }
  .label:focus { outline: none; border-bottom-color: var(--gold-dim); }
  .count {
    font-family: 'Cinzel', serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }

  .counter-foot {
    border-top: 1px solid var(--border);
    padding: 6px 12px;
    display: flex;
    justify-content: center;
    gap: 24px;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .toggle input { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
  .toggle:has(input:checked) { color: var(--amber); }

  /* A city has no unit count to tap up or down. */
  .counter.is-city .half { display: none; }
  .counter.is-city .count { font-size: 40px; line-height: 1.54; color: var(--amber); }

  .remove {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .remove:hover { color: var(--red); background: rgba(192,64,42,.12); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    padding: 24px 0;
  }

  /* Hamburger nav */
  .hamburger {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 200;
    background: none;
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: border-color .2s;
  }
  .hamburger:hover { border-color: var(--gold); }
  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--gold-dim);
    border-radius: 2px;
    transition: background .2s;
  }
  .hamburger:hover span { background: var(--gold); }
  .nav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 300;
  }
  .nav-overlay.open { display: block; }
  .nav-drawer {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100%;
    z-index: 400;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 48px 24px;
    transition: left .25s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .nav-drawer.open { left: 0; }
  .nav-drawer-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 16px;
  }
  .nav-link {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--text);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 3px;
    border: 1px solid transparent;
    transition: border-color .15s, color .15s;
    display: block;
  }
  .nav-link:hover { border-color: var(--gold-dim); color: var(--amber); }
  .nav-link.active { color: var(--amber); border-color: var(--gold-dim); background: rgba(201,168,76,.06); }
  .nav-link.disabled {
    color: var(--muted);
    border-color: transparent;
    opacity: .5;
    cursor: not-allowed;
    pointer-events: none;
  }
  .nav-link.disabled .soon-tag {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .8;
    margin-left: 6px;
  }
</style>
</head>
<body>

<button class="hamburger" onclick="openNav()" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div class="nav-overlay" id="nav-overlay" onclick="closeNav()"></div>
<div class="nav-drawer" id="nav-drawer">
  <p class="nav-drawer-title">Navigation</p>
  <a class="nav-link" href="index.html">Phase Order</a>
  <a class="nav-link" href="censusandcityhelper.html">Census &amp; City Helper</a>
  <span class="nav-link disabled" aria-disabled="true">Calamity Resolution<span class="soon-tag">Soon</span></span>
  <a class="nav-link active" href="conflict.html">Conflict Resolution</a>
  <a class="nav-link" href="strategy.html">Strategy &amp; Tips</a>
</div>

<header>
  <p class="eyebrow">Mega Empires</p>
  <h1>Conflict Resolution</h1>
  <div class="rule"></div>
</header>

<div class="content">
  <div class="limit-row">
    <label for="pop-limit">Population Limit</label>
    <input id="pop-limit" type="number" min="0" inputmode="numeric">
  </div>
  <div class="toolbar">
    <button class="tool-btn" id="add-btn" onclick="addCounter()">+ Add Counter</button>
    <button class="tool-btn" id="reset-btn" onclick="resetCounts()">Reset Counts</button>
  </div>
  <div class="counters" id="counters"></div>
  <button class="tool-btn resolve-btn" id="resolve-btn" onclick="resolveConflict()">Resolve</button>
</div>

<script>
  var STORAGE_KEY = 'mega-empires-conflict-counters';
  var LIMIT_KEY = 'mega-empires-conflict-limit';
  var counters = load();

  var limitInput = document.getElementById('pop-limit');
  try { limitInput.value = localStorage.getItem(LIMIT_KEY) || ''; } catch (e) {}
  limitInput.addEventListener('input', function() {
    try { localStorage.setItem(LIMIT_KEY, limitInput.value); } catch (e) {}
  });

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return [
      { label: '', count: 0, metalworking: false, city: false },
      { label: '', count: 0, metalworking: false, city: false }
    ];
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(counters)); } catch (e) {}
  }

  function render() {
    var list = document.getElementById('counters');
    list.innerHTML = '';
    if (!counters.length) {
      list.innerHTML = '<p class="empty">No counters. Tap “+ Add Counter” to add one.</p>';
      return;
    }
    counters.forEach(function(c, i) {
      var box = document.createElement('div');
      box.className = 'counter';
      box.innerHTML =
        '<div class="tap-area">' +
          '<button class="half dec" aria-label="Decrease">−</button>' +
          '<button class="half inc" aria-label="Increase">+</button>' +
          '<div class="counter-body">' +
            '<input class="label" type="text" placeholder="Label" maxlength="30">' +
            '<div class="count"></div>' +
          '</div>' +
        '</div>' +
        '<div class="counter-foot">' +
          '<label class="toggle mw-toggle"><input class="mw" type="checkbox"> Metalworking</label>' +
          '<label class="toggle city-toggle"><input class="city" type="checkbox"> City</label>' +
        '</div>' +
        '<button class="remove" aria-label="Remove counter">×</button>';

      var countEl = box.querySelector('.count');
      function showCount() {
        box.classList.toggle('is-city', !!c.city);
        countEl.textContent = c.city ? 'City' : c.count;
      }
      showCount();

      var label = box.querySelector('.label');
      label.value = c.label;
      label.addEventListener('input', function() { c.label = label.value; save(); });

      var mw = box.querySelector('.mw');
      mw.checked = !!c.metalworking;
      mw.addEventListener('change', function() { c.metalworking = mw.checked; save(); });

      var city = box.querySelector('.city');
      city.checked = !!c.city;
      city.addEventListener('change', function() {
        // Only one city per conflict: ticking this one unticks any other.
        if (city.checked) counters.forEach(function(o) { o.city = false; });
        c.city = city.checked;
        save();
        render();
      });

      box.querySelector('.dec').addEventListener('click', function() {
        if (c.count > 0) c.count--;
        countEl.textContent = c.count;
        save();
      });
      box.querySelector('.inc').addEventListener('click', function() {
        c.count++;
        countEl.textContent = c.count;
        save();
      });
      box.querySelector('.remove').addEventListener('click', function() {
        counters.splice(i, 1);
        save();
        render();
      });

      list.appendChild(box);
    });
  }

  function addCounter() {
    counters.push({ label: '', count: 0, metalworking: false, city: false });
    save();
    render();
  }

  function resetCounts() {
    counters.forEach(function(c) { c.count = 0; });
    save();
    render();
  }

  // Remove units in rounds. Each round, the counter with the fewest units
  // loses one first, then the next fewest, and so on; tied counters lose
  // theirs together. Stops as soon as only one counter has units left or
  // the total is at or below the population limit (blank counts as 0).
  // Counters with Metalworking lose their units after all the others in
  // each round; among themselves they still go fewest first.
  //
  // A city sits out at first: the other counters fight with a limit of 0,
  // leaving at most one. If that one has 7 or more units, the city becomes
  // 6 units and a normal resolve runs with the real limit; otherwise
  // nothing more happens.
  function resolveConflict() {
    var limit = Math.max(0, parseInt(limitInput.value, 10) || 0);
    var city = counters.filter(function(c) { return c.city; })[0];
    var others = counters.filter(function(c) { return c !== city; });
    if (!city) {
      resolveRounds(counters, limit);
    } else {
      resolveRounds(others, 0);
      var survivor = others.filter(function(c) { return c.count > 0; })[0];
      if (survivor && survivor.count >= 7) {
        city.city = false;
        city.count = 6;
        resolveRounds(counters, limit);
      }
    }
    save();
    render();
  }

  function resolveRounds(pool, limit) {
    function done() {
      var alive = pool.filter(function(c) { return c.count > 0; });
      var total = alive.reduce(function(sum, c) { return sum + c.count; }, 0);
      return alive.length <= 1 || total <= limit;
    }
    while (!done()) {
      var alive = pool.filter(function(c) { return c.count > 0; });
      // Rank is fixed at the start of the round: Metalworking last, then
      // fewest units first. Counters with the same rank lose units together.
      var rank = function(c) {
        return (c.metalworking ? 1e6 : 0) + c.count;
      };
      var ranks = [];
      alive.forEach(function(c) {
        if (ranks.indexOf(rank(c)) < 0) ranks.push(rank(c));
      });
      ranks.sort(function(a, b) { return a - b; });
      var groups = ranks.map(function(r) {
        return alive.filter(function(c) { return rank(c) === r; });
      });
      for (var i = 0; i < groups.length && !done(); i++) {
        groups[i].forEach(function(c) { c.count--; });
      }
    }
  }

  render();

  function openNav() {
    document.getElementById('nav-drawer').classList.add('open');
    document.getElementById('nav-overlay').classList.add('open');
  }
  function closeNav() {
    document.getElementById('nav-drawer').classList.remove('open');
    document.getElementById('nav-overlay').classList.remove('open');
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNav();
  });
</script>

</body>
</html>
